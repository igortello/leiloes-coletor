name: Teste navegador
on: workflow_dispatch
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python coletor/teste_navegador.py
        continue-on-error: true
      - name: Publicar
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r saida/. /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b teste && git add -A
          git -c user.name="coletor" -c user.email="coletor@users.noreply.github.com" commit -q -m "teste navegador"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" teste
