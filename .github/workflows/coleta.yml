name: Coleta Caixa
on:
  workflow_dispatch:
    inputs:
      criterios:
        description: "Critérios do portal (JSON)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: coleta
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Coletar
        timeout-minutes: 42
        env:
          LIMITE_MIN: "35"
          CRITERIOS: ${{ inputs.criterios }}
        run: python coletor/coletar.py
      - name: Publicar resultado no ramo "resultados"
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p /tmp/pub && cp -r saida/. /tmp/pub/ 2>/dev/null || true
          echo "{\"run_id\": \"$RUN_ID\", \"em\": \"$(date -u +%FT%TZ)\", \"ok\": $( [ -f saida/erro.json ] && echo false || echo true )}" > /tmp/pub/execucao.json
          cd /tmp/pub && git init -q -b resultados && git add -A
          git -c user.name="coletor" -c user.email="coletor@users.noreply.github.com" commit -q -m "Resultado da execução $RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultados
